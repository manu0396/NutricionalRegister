name: iOS Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-verification:
    name: ios-verification
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK for the included Gradle build
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --no-configuration-cache --console=plain

      - name: Lint SwiftUI sources
        run: swift format lint --strict --recursive iosApp/iosApp

      - name: Build native SwiftUI app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -destination 'generic/platform=iOS Simulator'
          build
