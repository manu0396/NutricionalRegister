name: Android Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verification:
    name: android-verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: cmdline-tools;latest platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify plain text (no emoji)
        run: ./scripts/check-no-emoji.sh

      - name: Build and verify Android and shared code
        run: >-
          ./gradlew
          :androidApp:assembleDebug
          :androidApp:assembleRelease
          :shared:testAndroidHostTest
          :architectureTest
          :coverageVerify
          :androidApp:lint
          :kotlinLint
          --no-configuration-cache
          --console=plain

      - name: Enable KVM for the emulator
        run: sudo chmod 666 /dev/kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --no-configuration-cache --console=plain
