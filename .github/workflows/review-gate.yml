name: Pull Request Review Activity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  review-activity:
    name: review-activity
    runs-on: ubuntu-latest
    steps:
      - name: Require a submitted review from someone other than the author
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setFailed("The pull request context is missing.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const review = reviews.find((candidate) =>
              candidate.user?.login !== pullRequest.user.login &&
              Boolean(candidate.submitted_at) &&
              ["APPROVED", "CHANGES_REQUESTED", "COMMENTED"].includes(candidate.state)
            );

            const summary = review
              ? `Review activity recorded from ${review.user.login} (${review.state}).`
              : "At least one submitted review from a non-author is required; approval is not required.";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "review-activity-head",
              head_sha: pullRequest.head.sha,
              status: "completed",
              conclusion: review ? "success" : "failure",
              output: {
                title: review ? "Review activity recorded" : "Review activity required",
                summary,
              },
            });

            if (!review) {
              core.setFailed("At least one submitted review from a non-author is required; approval is not required.");
              return;
            }

            core.info(summary);
