name: Pull Request Review Activity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  review-activity:
    name: review-activity
    runs-on: ubuntu-latest
    steps:
      - name: Review gate removed (single-maintainer)
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.info("No pull request context; skipping.");
              return;
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "review-activity-head",
              head_sha: pullRequest.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Review gate removed",
                summary: "Review gate removed for single-maintainer workflow; no review required.",
              },
            });

            core.info("Review gate removed; passing without requiring a review.");
