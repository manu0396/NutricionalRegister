name: Pull Request Review Activity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  review-activity:
    name: review-activity
    runs-on: ubuntu-latest
    steps:
      - name: Require a submitted review (ADR-0012 single-maintainer gate)
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setFailed("The pull request context is missing.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            // ADR-0012: a submitted review from ANY account (including the PR
            // author) satisfies the gate, because this repository has a single
            // collaborator and a non-author review is otherwise impossible. The
            // gate still requires a *submitted* review and records which one it
            // was, so the evidence stays auditable. If a second reviewer is ever
            // added, restore the non-author condition to tighten the gate.
            const review = reviews.find((candidate) =>
              Boolean(candidate.submitted_at) &&
              ["APPROVED", "CHANGES_REQUESTED", "COMMENTED"].includes(candidate.state)
            );

            const summary = review
              ? `Review activity recorded from ${review.user.login} (${review.state}).`
              : "At least one submitted review is required; approval is not required.";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "review-activity-head",
              head_sha: pullRequest.head.sha,
              status: "completed",
              conclusion: review ? "success" : "failure",
              output: {
                title: review ? "Review activity recorded" : "Review activity required",
                summary,
              },
            });

            if (!review) {
              core.setFailed("At least one submitted review is required; approval is not required.");
              return;
            }

            core.info(summary);
