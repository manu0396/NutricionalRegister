#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Coach (ADR-0016, ADR-0020)
#The address of the first-party AI gateway. It is build configuration, not a
#credential, and the app ships it as a generated string resource. On the
#Android emulator 10.0.2.2 is the host machine, so a gateway started with
#`gateway/start-dev.sh` answers there. A release build points at the deployed
#gateway instead, which is a change of this property, never of code.
#A build without it has no Coach and the screen says so plainly.
NUTRILOG_AI_PROXY_URL=https://10.0.2.2:8443
